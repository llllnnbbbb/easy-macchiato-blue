# Easy Macchiato Blue — 推荐的 classicui.conf 片段
# 路径：~/.config/fcitx5/conf/classicui.conf
#
# 说明：
# - 本主题的 theme.conf 不设置 Font，字体完全由本文件控制
# - 只需合并下列键值到你现有的 classicui.conf（不必整文件覆盖）
# - 字体使用 Linux 常见的 Noto 系列（请确认本机已安装 fonts-noto-cjk）

# 垂直候选列表（False = 横向候选条，与本主题默认观感一致）
Vertical Candidate List=False
# 使用鼠标滚轮翻页
WheelForPaging=True

# ---------- 字体（必调，决定候选/菜单观感）----------
# 候选面板字体
Font="Noto Sans CJK SC 13"
# 菜单字体
MenuFont="Noto Sans CJK SC Medium 11"
# 托盘文字图标字体（PreferTextIcon=True 时生效）
TrayFont="Noto Sans CJK SC Bold 12"

# ---------- 托盘文字颜色（深色面板 / 深色顶栏时较合适）----------
# 托盘标签轮廓颜色
TrayOutlineColor=#77767b
# 托盘标签文本颜色
TrayTextColor=#f6f5f4

# ---------- 主题 ----------
# 优先使用文字图标
PreferTextIcon=True
# 在图标中显示布局名称
ShowLayoutNameInIcon=True
# 使用输入法的语言来显示文字（拼音显示中文字形等）
UseInputMethodLanguageToDisplayText=True
# 主题目录名（安装后为 src/easy-macchiato-blue）
Theme=easy-macchiato-blue
# 深色主题（可与 Theme 相同；若另有浅色主题可拆开配置）
DarkTheme=easy-macchiato-blue
# 跟随系统浅色/深色设置（本主题为深色；若只想固定深色可保持 False）
UseDarkTheme=False
# 跟随系统重点色（本主题自带 Macchiato Blue，建议关闭以免打乱配色）
UseAccentColor=False

# ---------- 显示 / DPI ----------
# 在 X11 上针对不同屏幕使用单独的 DPI
PerScreenDPI=False
# 固定 Wayland 的字体 DPI（0 = 不覆盖）
ForceWaylandDPI=0
# 在 Wayland 下启用分数缩放
EnableFractionalScale=True
