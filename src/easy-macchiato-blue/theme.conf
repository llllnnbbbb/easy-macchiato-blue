# vim: ft=dosini
[Metadata]
# 名称
Name=Easy Macchiato Blue
# 版本
Version=1.2
# 作者（含上游 Catppuccin 原作者）
Author=justTOBBI, Isabelinc, Kurome, easy
# 描述
Description=Easy Macchiato Blue — refined Catppuccin Macchiato Blue layout for Fcitx5 (fonts via classicui)
# 随 DPI 缩放
ScaleWithDPI=True

# 字体请在 ~/.config/fcitx5/conf/classicui.conf 中配置，主题内 Font 无效

[InputPanel]
# 候选词间距
Spacing=3
# 竖排列表时高亮占满横向空间
FullWidthHighlight=True
# 未选中候选文字颜色（Text）
NormalColor=#cad3f5
# 选中候选文字颜色（Base，配蓝高亮）
HighlightCandidateColor=#24273a
# 预编辑 / 组字文字颜色（Blue）
HighlightColor=#8aadf4
# 预编辑 / 组字背景颜色（Mantle，与面板区分）
HighlightBackgroundColor=#1e2030
# 候选序号字号比例（相对主字体，100=同等大小）
LabelTextSizeFactor=90

[InputPanel/TextMargin]
# 左侧边距（须与 Highlight/Margin 一致）
Left=14
# 右侧边距
Right=14
# 顶部边距
Top=7
# 底部边距
Bottom=7

[InputPanel/ContentMargin]
# 左侧边距（面板内边相对高亮块的呼吸空间）
Left=9
# 右侧边距
Right=9
# 顶部边距
Top=7
# 底部边距
Bottom=6

[InputPanel/Background]
# 背景颜色（有 Image 时以 SVG 为准；SVG 为 Surface0 #363a4f）
Color=#363a4f
# 边框颜色（有 Image 时通常不生效）
BorderColor=#494d64
# 边框宽度
BorderWidth=1
# 背景图片
Image=panel.svg

[InputPanel/Background/Margin]
# 左侧边距
Left=10
# 右侧边距
Right=10
# 顶部边距
Top=10
# 底部边距
Bottom=10

[InputPanel/Highlight]
# 高亮背景颜色（有 Image 时以 SVG 为准；SVG 为 Blue #8aadf4）
Color=#8aadf4
# 高亮背景图片
Image=highlight.svg

[InputPanel/Highlight/Margin]
# 与 TextMargin 相同，避免高亮块额外外扩
Left=14
# 右侧边距
Right=14
# 顶部边距
Top=7
# 底部边距
Bottom=7

[Menu]
# 一般文字颜色
NormalColor=#cad3f5
# 选中项文字颜色
HighlightCandidateColor=#24273a
# 菜单项间距
Spacing=3

[Menu/Background]
# 背景颜色（Base）
Color=#24273a
# 边框颜色
BorderColor=#494d64
# 边框宽度
BorderWidth=1

[Menu/Background/Margin]
# 左侧边距
Left=4
# 右侧边距
Right=4
# 顶部边距
Top=4
# 底部边距
Bottom=4

[Menu/ContentMargin]
# 左侧边距
Left=4
# 右侧边距
Right=4
# 顶部边距
Top=4
# 底部边距
Bottom=4

[Menu/Highlight]
# 选中项背景颜色（Blue；上游原为 Pink）
Color=#8aadf4

[Menu/Highlight/Margin]
# 左侧边距
Left=10
# 右侧边距
Right=10
# 顶部边距
Top=5
# 底部边距
Bottom=5

[Menu/Separator]
# 分隔线颜色（Surface0）
Color=#363a4f

[Menu/CheckBox]
# 复选框图片
Image=radio.png

[Menu/SubMenu]
# 子菜单箭头图片
Image=arrow.png

[Menu/TextMargin]
# 左侧边距
Left=6
# 右侧边距
Right=6
# 顶部边距
Top=5
# 底部边距
Bottom=5
